app = "recon"
primary_region = "iad"

[build]
  image = "python:3.11-slim"

[env]
  PORT = "5000"
  SECRET_KEY = "change-me"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
